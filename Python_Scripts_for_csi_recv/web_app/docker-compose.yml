services:
  api:
    build:
      context: ..
      dockerfile: web_app/Dockerfile
    env_file:
      - .env
    environment:
      CSI_MODEL_DIR: /models/har
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - csi_app_data:/data
      - ../models/har:/models/har:ro
      - ../models/motion:/models/motion:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  csi_app_data:
